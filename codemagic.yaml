workflows:
  android-debug-apk:
    name: Carina Picker - Debug APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Download Gradle 9.4.1
        script: |
          cd "$CM_BUILD_DIR"
          curl -L --fail --retry 3 --retry-delay 2 \
            -o gradle-9.4.1-bin.zip \
            https://services.gradle.org/distributions/gradle-9.4.1-bin.zip
          rm -rf .gradle-dist
          mkdir -p .gradle-dist
          unzip -q gradle-9.4.1-bin.zip -d .gradle-dist
      - name: Build installable debug APK
        script: |
          cd "$CM_BUILD_DIR"
          ./.gradle-dist/gradle-9.4.1/bin/gradle --no-daemon clean assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
