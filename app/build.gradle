plugins {
    id 'com.android.application'
}

android {
    namespace 'com.carina.picker'
    compileSdk 36

    defaultConfig {
        applicationId 'com.carina.picker'
        minSdk 24
        targetSdk 36
        versionCode 8
        versionName '0.6.3'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
